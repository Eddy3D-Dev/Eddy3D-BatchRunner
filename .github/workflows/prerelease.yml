name: prerelease

on:
  push:
    branches:
      - dev

jobs:
  prerelease:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content .\BatchRunner\BatchRunner.csproj
          $version = $csproj.Project.PropertyGroup |
            Where-Object { $_.Version } |
            Select-Object -First 1 -ExpandProperty Version
          if (-not $version) {
            throw "Version not found in BatchRunner.csproj"
          }
          $preVersion = "$version-pre.${{ github.run_number }}"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$preVersion"
      - name: Publish
        run: dotnet publish .\BatchRunner\BatchRunner.csproj -c Release -r win-x64 -o .\publish
      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Pre-release ${{ steps.version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: publish/BatchRunner.exe
          fail_on_unmatched_files: true
